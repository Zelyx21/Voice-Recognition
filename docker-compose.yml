version: "3.9"

services:

  # VECTOR DATABASE
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BACKEND FASTAPI
  backend:
    mem_limit: 20g
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice_backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
      - PYTHONUNBUFFERED=1
    command: uvicorn api.api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - voice_network

  # FRONTEND REACT
  frontend:
    build:
      context: ./website/voice-recognition
      dockerfile: Dockerfile
    container_name: voice_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./website/voice-recognition:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - voice_network

networks:
  voice_network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local