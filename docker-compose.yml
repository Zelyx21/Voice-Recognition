version: "3.9"

services:

  # VECTOR DATABASE
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # BACKEND FASTAPI
  backend:
    build: .
    container_name: voice_backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
    command: uvicorn api.api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - qdrant

  # FRONTEND REACT
  frontend:
    build: ./website/voice-recognition
    container_name: voice_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./website/voice-recognition:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend