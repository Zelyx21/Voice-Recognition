version: "3.9"

services:

  # ─── Qdrant : base vectorielle ───────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./database/qdrant_storage:/qdrant/storage:z
    networks:
      - voice_net

  # ─── Backend FastAPI + GPU ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # Décommenter si derrière proxy Dell :
      # args:
      #   HTTP_PROXY: "http://proxy.dell.com:PORT"
      #   HTTPS_PROXY: "http://proxy.dell.com:PORT"
    container_name: voice_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Modèles montés en lecture seule (déjà téléchargés sur l'hôte)
      - ./CosyVoice/pretrained_models:/app/CosyVoice/pretrained_models:ro
      - ./ai/model:/app/ai/model:ro
      # Qdrant storage partagé si nécessaire
      - ./database/qdrant_storage:/app/database/qdrant_storage:z
    environment:
      - HF_HUB_OFFLINE=1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - voice_net

networks:
  voice_net:
    driver: bridge